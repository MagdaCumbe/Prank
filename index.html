<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação Real</title>
    <style>
        body { background: #121212; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        button { padding: 20px; background: #f04e23; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <button onclick="enviarNotificacaoReal()">Enviar Notificação Real</button>

    <script>
        // 1. Pedir permissão ao abrir a página
        window.onload = () => {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        };

        function enviarNotificacaoReal() {
            if (Notification.permission === "granted") {
                const options = {
                    body: 'Parabéns! Você realizou uma venda: R$ 97,00',
                    icon: 'https://cdn-icons-png.flaticon.com/512/5968/5968279.png', // Ícone genérico de venda
                    vibrate: [200, 100, 200],
                    tag: 'venda-hotmart' // Evita acumular várias iguais
                };

                // Dispara a notificação do sistema
                const n = new Notification('Venda Realizada!', options);
                
                // Toca o som (opcional, o sistema já deve vibrar)
                const audio = new Audio('https://www.myinstants.com/media/sounds/caixa-registradora-venda.mp3');
                audio.play();
            } else {
                alert("Você precisa permitir as notificações nas configurações do navegador!");
                Notification.requestPermission();
            }
        }
    </script>
</body>
</html>
